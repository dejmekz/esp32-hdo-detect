[platformio]
default_envs = esp32-c3-devkitm-1
; Heslo pro OTA upload - ota.secret.ini není v gitu
; (šablona: ota.secret.ini.example).
extra_configs = *.secret.ini

; Výchozí hodnota, přepíše ji ota.secret.ini.
[ota]
password =

; Upload přes USB kabel.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Serial přes nativní USB ESP32-C3 (LaskaKit nemá USB-UART převodník).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Upload přes Wi-Fi: pio run -e ota -t upload
; První firmware s OTA je nutné nahrát přes USB.
[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = hdo-monitor.local
upload_flags =
    --auth=${ota.password}
