[platformio]
default_envs = esp32-c3-devkitm-1
; Heslo pro OTA upload - ota.secret.ini není v gitu
; (šablona: ota.secret.ini.example).
extra_configs = *.secret.ini

; Výchozí hodnota, přepíše ji ota.secret.ini.
[ota]
password =

[common]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Serial přes nativní USB ESP32-C3 (LaskaKit nemá USB-UART převodník).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Upload přes USB kabel.
[env:esp32-c3-devkitm-1]
; Pevná verze platformy: novější (Arduino 3.x / IDF 5) mění API,
; např. esp_task_wdt_init(), a build by selhal.
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Verze z git describe => makro FW_VERSION (log, hdo/state, HA).
extra_scripts = pre:scripts/version.py

; Přesné verze - build se nezmění vydáním nové verze knihovny.
lib_deps =
    knolleary/PubSubClient @ 2.8.0
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.12.6

build_flags =
    ${common.build_flags}
    ; OLED SSD1306 (I2C GPIO8/10): 1 = zapnuto. Stav signalizuje RGB LED.
    -DHDO_OLED=0

; Varianta s OLED displejem (CI ji sestavuje, aby kód OLED nezastaral).
[env:esp32-c3-oled]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${common.build_flags}
    -DHDO_OLED=1

; Upload přes Wi-Fi: pio run -e ota -t upload
; První firmware s OTA je nutné nahrát přes USB.
[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = hdo-monitor.local
upload_flags =
    --auth=${ota.password}

; Unit testy čisté logiky (lib/HdoCore) na PC: pio test -e native
; Potřebuje kompilátor gcc/g++ v PATH.
[env:native]
platform = native
test_framework = unity
